<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create account</title>
    <link rel="stylesheet" href="assets/CSS/login-signup.css" />
  </head>
  <body class="auth-body">
    <div class="auth-wrapper">
      <div class="auth-card">
        <h1 class="auth-heading">Create a new account</h1>
        <p class="auth-subheading">
          It's free and you don't have to share your address.
        </p>
        <form class="auth-form">
          <div class="row">
            <div class="field-group col-12 col-sm-6">
              <label for="firstName" class="field-label">First name:</label>
              <input
                type="text"
                class="field-input"
                placeholder="First name"
                id="firstName"
              />
            </div>
            <div class="field-group col-12 col-sm-6">
              <label for="lastName" class="field-label">Last name:</label>
              <input
                type="text"
                class="field-input"
                placeholder="Last name"
                id="lastName"
              />
            </div>
          </div>
          <div class="field-group">
            <label for="email" class="field-label">Email:</label>
            <input
              type="email"
              class="field-input"
              placeholder="example@example.com"
              id="email"
              required
            />
          </div>
          <div class="field-group">
            <label for="password" class="field-label">Password:</label>
            <input
              type="password"
              class="field-input"
              id="password"
              required
            />
          </div>
          <label class="field-label">Date Of Birth :</label>
          <div class="row no-gutters">
            <div class="field-group col-4">
              <label for="birthdayDay" class="sr-only">Birthday day</label>
              <select class="field-input" id="birthdayDay">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                    <option value="9">9</option>
                    <option value="10">10</option>
                    <option value="11">11</option>
                    <option value="12">12</option>
                    <option value="13">13</option>
                    <option value="14">14</option>
                    <option value="15">15</option>
                    <option value="16">16</option>
                    <option value="17">17</option>
                    <option value="18">18</option>
                    <option value="19">19</option>
                    <option value="20">20</option>
                    <option value="21">21</option>
                    <option value="22">22</option>
                    <option value="23">23</option>
                    <option value="24">24</option>
                    <option value="25">25</option>
                    <option value="26">26</option>
                    <option value="27">27</option>
                    <option value="28">28</option>
                    <option value="29">29</option>
                    <option value="30">30</option>
                    <option value="31">31</option>
              </select>
            </div>
            <div class="field-group col-4">
              <label for="birthdayMonth" class="sr-only">Birthday month</label>
              <select class="field-input" id="birthdayMonth">
                    <option value="january">January</option>
                    <option value="february">February</option>
                    <option value="march">March</option>
                    <option value="april">April</option>
                    <option value="may">May</option>
                    <option value="june">June</option>
                    <option value="july">July</option>
                    <option value="august">August</option>
                    <option value="september">September</option>
                    <option value="october">October</option>
                    <option value="november">November</option>
                    <option value="december">December</option>
              </select>
            </div>
            <div class="field-group col-4">
              <label for="birthdayYear" class="sr-only">Date Of Birth</label>
              <select class="field-input" id="birthdayYear">
                    <option value="1980">1980</option>
                    <option value="1981">1981</option>
                    <option value="1982">1982</option>
                    <option value="1983">1983</option>
                    <option value="1984">1984</option>
                    <option value="1985">1985</option>
                    <option value="1986">1986</option>
                    <option value="1987">1987</option>
                    <option value="1988">1988</option>
                    <option value="1989">1989</option>
                    <option value="1990">1990</option>
                    <option value="1991">1991</option>
                    <option value="1992">1992</option>
                    <option value="1993">1993</option>
                    <option value="1994">1994</option>
                    <option value="1995">1995</option>
                    <option value="1996">1996</option>
                    <option value="1997">1997</option>
                    <option value="1998">1998</option>
                    <option value="1999">1999</option>
                    <option value="2000">2000</option>
                    <option value="2001">2001</option>
                    <option value="2002">2002</option>
                    <option value="2003">2003</option>
                    <option value="2004">2004</option>
                    <option value="2005">2005</option>
                    <option value="2006">2006</option>
                    <option value="2007">2007</option>
                    <option value="2008">2008</option>
                    <option value="2009">2009</option>
                    <option value="2010">2010</option>
              </select>
            </div>
          </div>
          <div class="gender-options">
            <label>
              <input
                type="radio"
                name="gender"
                value="male"
                checked
              />
              Man
            </label>
            <label>
              <input
                type="radio"
                name="gender"
                value="female"
              />
              Woman
            </label>
          </div>
          <button type="submit" class="auth-btn-primary" formaction="Thank You.html">
            Submit
          </button>
          <div class="auth-notice" role="alert">
            By clicking above you agree to our
            <a href="#" class="alert-link">Terms &amp; Conditions</a> and
            our <a href="#" class="alert-link">Privacy Policy</a>.
          </div>
          <div class="auth-separator">or ...</div>
          <a href="Login.html" class="auth-btn-secondary">Login</a>
        </form>
      </div>
    </div>
  </body>
</html>
