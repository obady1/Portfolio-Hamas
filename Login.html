<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <!-- Bootstrap CSS (للهيكل الأساسي) -->
    <link
      rel="stylesheet"
      href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0-beta.2/css/bootstrap.min.css"
      integrity="sha384-PsH8R72JQ3SOdhVi3uxftmaW6Vc51MKb0q5P2rRUpPvrszuE4W1povHYgTpBfshb"
      crossorigin="anonymous"
    />
    <!-- أنماط المصادقة المخصصة -->
    <link rel="stylesheet" href="assets/CSS/login-signup.css" />
  </head>
  <body class="auth-body">
    <div class="auth-wrapper">
      <div class="auth-card">
        <h1 class="auth-heading">Please log in</h1>
        <form class="auth-form">
          <div class="field-group">
            <label for="email" class="field-label">Email:</label>
            <input
              type="email"
              class="field-input"
              placeholder="Enter Your Gmail"
              id="email"
              required
            />
          </div>
          <div class="field-group">
            <label for="password" class="field-label">Password:</label>
            <input
              type="password"
              class="field-input"
              id="password"
              required
            />
          </div>
          <button type="submit" class="auth-btn-primary" formaction="index.html">
            Login
          </button>
        </form>
        <div class="auth-separator">or..</div>
        <div class="text-center">
          <a href="signup.html" class="auth-btn-secondary">Create account</a>
          <p class="small" style="margin-top: 0.5rem;">
            <a href="#" class="auth-link">Have you forgotten your account details?</a>
          </p>
        </div>
      </div>
    </div>

  </body>
</html>
